# CrossRef journal sources
# Used by: src/crossref_fetcher.py
#
# To add a new journal: append an entry with its ISSN.
# Find ISSN at https://portal.issn.org or the journal's About page.
#
# Fields:
#   name         display name in report
#   issn         print or electronic ISSN (CrossRef accepts either)
#   days_back    how many days of articles to fetch (default: 14)
#   max_items    max articles to retrieve per run (default: 30)
#   bc_filter    filter to dementia-relevant articles only (default: true)
#
# CrossRef API is free, no key required.
# Polite pool: include a mailto in User-Agent (set in crossref_fetcher.py).

crossref_email: "ppoiu87@gmail.com"   # used in User-Agent for CrossRef polite pool

journals:
  - name: Alzheimer's & Dementia
    full_name: "Alzheimer's & Dementia: The Journal of the Alzheimer's Association"
    issn: "1552-5260"
    days_back: 14
    max_items: 30
    bc_filter: true

  - name: Lancet Neurology
    full_name: "The Lancet Neurology"
    issn: "1474-4422"
    days_back: 14
    max_items: 25
    bc_filter: true

  - name: JAMA Neurology
    full_name: "JAMA Neurology"
    issn: "2168-6149"
    days_back: 14
    max_items: 25
    bc_filter: true

  - name: Neurology
    full_name: "Neurology"
    issn: "0028-3878"
    days_back: 14
    max_items: 30
    bc_filter: true

  - name: Alzheimer's Research & Therapy
    full_name: "Alzheimer's Research & Therapy"
    issn: "1758-9193"
    days_back: 14
    max_items: 25
    bc_filter: true

  - name: NEJM
    full_name: "New England Journal of Medicine"
    issn: "0028-4793"
    days_back: 14
    max_items: 20
    bc_filter: true

