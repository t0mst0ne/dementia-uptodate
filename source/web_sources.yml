sources:
  - name: Alzforum
    type: rss
    url: "https://www.alzforum.org/rss.xml"
    max_items: 20
    bc_filter: false

  - name: NeurologyToday
    type: google_news
    domain: neurotodayonline.com
    query: "Alzheimer dementia"
    max_items: 20
    noise_filter: "membership|about|contact|award|meeting registration"

  - name: NEJM Alzheimer
    type: google_news
    domain: nejm.org
    query: "Alzheimer dementia cognitive"
    max_items: 15
    noise_filter: null

  - name: JAMA Neurology
    type: google_news
    domain: jamanetwork.com
    query: "Alzheimer dementia"
    max_items: 15
    noise_filter: null

  - name: Alzheimer's Association News
    type: google_news
    domain: alz.org
    query: "Alzheimer treatment research"
    max_items: 20
    noise_filter: "donate|walk|chapter|volunteer"

  - name: CTAD / AAIC News
    type: google_news
    domain: ctad-alzheimer.com
    query: "Alzheimer clinical trial"
    max_items: 10
    noise_filter: null

  - name: OncLive Neurology (fallback)
    type: google_news
    domain: neurologylive.com
    query: "Alzheimer dementia"
    max_items: 20
    noise_filter: "membership|about|contact"
